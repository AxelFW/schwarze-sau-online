services:
  - type: web
    name: schwarze-sau-online
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ROOM_TTL_MS
        value: "1800000"
      - key: BOT_DELAY_MS
        value: "650"
      - key: EXPIRY_SWEEP_MS
        value: "60000"
      - key: QUETSCH_REVIEW_MS
        value: "2600"
      - key: REST_CLAIM_MAX_TRICKS
        value: "3"
      # VITE_ENABLE_EASY_MODE=false hides only the lobby option; ?easyMode=true can still enable Bot-Tipps.
      - key: VITE_ENABLE_EASY_MODE
        value: "true"
